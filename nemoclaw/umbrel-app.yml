manifestVersion: 1
id: nemoclaw
name: NemoClaw
tagline: Secure AI agent sandbox with managed local inference
icon: https://avatars.githubusercontent.com/u/1728152?s=200&v=4
category: AI
version: "1.0.0"
port: 18789
description: >-
  NemoClaw is NVIDIA's open-source stack for running OpenClaw AI agents
  securely inside an OpenShell sandbox. It provides a sandboxed environment
  for autonomous agents with strict network, filesystem, and inference
  routing policies.

  This app is configured to use a local OpenAI-compatible inference endpoint
  (e.g. llama.cpp, vLLM, or Ollama) — no NVIDIA API key required.

  Note: Alpha software. APIs and behaviour may change without notice.
