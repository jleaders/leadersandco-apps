manifestVersion: 1
id: organic-mail-server
name: Organic Mail Server
tagline: Video messaging notification server
icon: https://organicmail.co/user/pages/01.home/logo-large.png
category: Communication
version: "1.0.0"
port: 3000
description: >-
  Organic Mail Server is a high-performance Go-based notification server for the Organic Mail video messaging app.

  Features:
  - Firebase Cloud Messaging (FCM) integration
  - RESTful API for sending notifications
  - Built-in health monitoring
  - Docker containerized deployment
  - ~10x faster startup than Node.js version
  - ~2-3x lower memory usage

  This server handles push notifications for the Organic Mail Flutter app, enabling instant delivery of video message notifications to users across iOS and Android platforms.

